name: Regenerate & Publish

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install portal dependencies
        run: npm ci
        working-directory: portal

      - name: Build Next.js portal
        run: npm run portal:build

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Fetch dataset last-modified date
        id: dataset-date
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          DATE=$(hf datasets info nvidia/simready-assets --format json | python -c "import sys, json; d = json.load(sys.stdin)['last_modified']; print(d.split('T')[0].replace('-', ''))")
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Cache dataset payloads
        uses: actions/cache@v6
        with:
          path: data/cache/simready-assets
          key: simready-assets-${{ github.ref_name }}-${{ steps.dataset-date.outputs.date }}
          restore-keys: |
            simready-assets-${{ github.ref_name }}-
            simready-assets-main-

      - name: Run pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m pipeline.run_all

      - name: Publish to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m pipeline.publish --namespace thisisrick25 --what both

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add card/
          git add portal/data/
          git diff --cached --quiet || git commit -m "chore: regenerate catalog artifacts [skip ci]"
          git push
