name: Regenerate & Publish

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Cache dataset payloads
        uses: actions/cache@v4
        with:
          path: data/cache/simready-assets
          key: simready-assets-main
          restore-keys: |
            simready-assets-

      - name: Run pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m pipeline.run_all

      - name: Publish to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m pipeline.publish --namespace thisisrick25 --what both

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add card/ portal/data/ data/stats.json
          git diff --cached --quiet || git commit -m "chore: regenerate catalog artifacts [skip ci]"
          git push
